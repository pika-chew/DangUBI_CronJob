# 테스트 전용 프로필. 외부 DB 없이 H2 메모리 DB(MySQL 호환 모드)로 돈다.
spring:
  datasource:
    url: jdbc:h2:mem:ubi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  batch:
    job:
      # 컨텍스트가 뜰 때 Job이 자동 실행되지 않게 한다. 테스트가 직접 실행한다.
      enabled: false
    jdbc:
      # 메타 테이블(BATCH_*)을 H2에 만든다. Boot가 H2용 스키마 스크립트를 고른다.
      initialize-schema: always
