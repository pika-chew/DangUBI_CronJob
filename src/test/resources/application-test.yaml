# 테스트 전용 프로필. 외부 DB 없이 H2 메모리 DB(MySQL 호환 모드)로 돈다.
spring:
  datasource:
    url: jdbc:h2:mem:ubi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  batch:
    job:
      # 컨텍스트가 뜰 때 Job이 자동 실행되지 않게 한다. 테스트가 직접 실행한다.
      enabled: false
    jdbc:
      # 메타 테이블(BATCH_*)을 H2에 만든다. Boot가 H2용 스키마 스크립트를 고른다.
      initialize-schema: always
  sql:
    init:
      # 운영과 같은 DDL로 업무 테이블을 만든다.
      mode: always
      schema-locations: classpath:db/trip-schema-mysql.sql
  jpa:
    hibernate:
      # 엔티티와 DDL이 어긋나면 컨텍스트가 뜨지 않게 한다.
      ddl-auto: validate

ubi:
  batch:
    ingest:
      # 파일 하나마다 커밋해 이어 읽기를 확인할 수 있게 한다.
      chunk-size: 1
  # 외부 저장소 클라이언트 빈을 만들기 위한 가짜 값. 빈을 만들 때는 접속하지 않고, 테스트는 포트를 Mock으로 바꾼다.
  swift:
    endpoint: http://localhost:65535
    container: test-raw
    access-key: test-access
    secret-key: test-secret
    region: us-east-1
