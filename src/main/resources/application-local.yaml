# 로컬 개발용. compose.yaml의 MySQL에 붙는다. 운영 값은 넣지 않는다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ubi
    username: ubi
    password: ubi
  batch:
    jdbc:
      initialize-schema: always
  sql:
    init:
      # 업무 테이블을 자동으로 만든다. IF NOT EXISTS라 매번 실행해도 된다.
      mode: always
      schema-locations: classpath:db/trip-schema-mysql.sql
