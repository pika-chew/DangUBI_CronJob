spring:
  application:
    name: dangUBI
  main:
    # HTTP 서버 없이 Job 하나를 실행하고 종료한다.
    web-application-type: none
  batch:
    job:
      # 실행할 Job은 --spring.batch.job.name=<jobName> 인자로 고른다.
      enabled: true
    jdbc:
      # Spring Batch 메타 테이블(BATCH_*)은 MySQL에 둔다.
      # 운영은 never: 테이블을 미리 만들어 둔다(spring-batch-core jar의 org/springframework/batch/core/schema-mysql.sql).
      # 로컬은 application-local.yaml에서 always로 덮어쓴다.
      initialize-schema: never
  # 접속 정보는 환경 변수로 받는다: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  jpa:
    hibernate:
      # 업무 테이블은 db/trip-schema-mysql.sql로 만든다. 운영은 배포 전에 직접 실행한다.
      ddl-auto: none
    properties:
      hibernate:
        # 시각은 UTC로 저장한다. Instant는 타임존 없는 DATETIME 컬럼에 UTC 값으로 들어간다.
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

ubi:
  batch:
    ingest:
      # chunk 하나에 담는 수집 파일 수. chunk마다 커밋된다.
      # [MEMORY RISK] 이 값만큼의 파일 내용과 엔티티가 커밋 전까지 한꺼번에 힙에 올라간다.
      #               운영 최대 파일 크기 × 이 값이 힙 한도 안에 들어오는지 장애 테스트로 확인한다. (임시값)
      chunk-size: 10
  # 외부 저장소 접속 정보는 환경 변수로 받는다. 비어 있으면 앱이 뜰 때 실패한다. local 프로필에서는 읽지 않는다.
  s3:
    # Firehose가 쓰는 AWS S3 원본 버킷. 자격 증명은 AWS SDK 기본 체인(AWS_ACCESS_KEY_ID 등 또는 IRSA)으로 찾는다.
    bucket: ${S3_SOURCE_BUCKET:}
    region: ${AWS_REGION:}
  sqs:
    # 수집 워커가 읽는 큐. 누락 객체를 S3 이벤트 형식으로 다시 넣는다.
    queue-url: ${SQS_REQUEUE_QUEUE_URL:}
    region: ${AWS_REGION:}
  swift:
    # Swift proxy의 s3api 주소와 컨테이너. 인증은 Keystone EC2 credentials(access/secret)로 한다.
    endpoint: ${SWIFT_ENDPOINT:}
    container: ${SWIFT_CONTAINER:}
    access-key: ${SWIFT_ACCESS_KEY:}
    secret-key: ${SWIFT_SECRET_KEY:}
    # 서명에 쓰는 리전 이름. s3api의 location 설정과 맞춘다(기본 us-east-1).
    region: ${SWIFT_REGION:us-east-1}
